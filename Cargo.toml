[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/win"]
exclude = ["vendor", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PowerUserZ/tuxread"

[workspace.dependencies]
tuxread-core = { path = "crates/core" }
tuxread-win = { path = "crates/win" }
gptman = { version = "3.1", default-features = false }
mbrman = "0.6"
ext4-view = { version = "1.0", features = ["std"] }
windows-sys = "=0.61.2"

# test-only
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"

[patch.crates-io]
# ext4-view 1.0.0 plus two fixes found by the corpus; see vendor/ext4-view/PATCHES.md.
ext4-view = { path = "vendor/ext4-view" }
