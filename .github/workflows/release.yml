# Release (spec §7.6, §9): on a v* tag, each architecture is tested, built, packaged and checked
# on its own runner (installer and portable zip, with SHA-256 checksums), and a draft GitHub
# Release is made for the maintainer to review and publish. Run by hand, it stops before the
# release and keeps the files as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { Write-Error "tag $env:GITHUB_REF_NAME is not v$version"; exit 1 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update; rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-about@0.9.2
      - run: npm ci
      - run: cargo test --locked --workspace
      - run: node scripts/third-party-licenses.mjs THIRD-PARTY-LICENSES.txt
      - run: npx tauri build --config src-tauri/tauri.release.json
      - run: cargo build --locked --release -p tuxread-cli
      - run: ./scripts/package.ps1 -Arch ${{ matrix.arch }} -Out release
      - run: ./scripts/check-release.ps1 -Arch ${{ matrix.arch }} -Dir release -Install
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: release
          retention-days: 14

  publish:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: The checksums hold for the files as downloaded
        working-directory: release
        run: sha256sum -c ./*.sha256
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* --draft --verify-tag \
            --title "TuxRead ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
